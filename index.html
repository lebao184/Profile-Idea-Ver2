  <button class="settings-trigger" id="settingsTrigger" aria-label="Mở cài đặt giao diện" title="Cài đặt"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M13.4 3h5.2l.8 3.2a10 10 0 0 1 2.1 1.2l3.1-1.1 2.6 4.5-2.4 2.2a10 10 0 0 1 0 2.4l2.4 2.2-2.6 4.5-3.1-1.1a10 10 0 0 1-2.1 1.2l-.8 3.2h-5.2l-.8-3.2a10 10 0 0 1-2.1-1.2l-3.1 1.1-2.6-4.5 2.4-2.2a10 10 0 0 1 0-2.4l-2.4-2.2 2.6-4.5 3.1 1.1a10 10 0 0 1 2.1-1.2L13.4 3Z"/><circle cx="16" cy="14" r="3.4"/></svg></button>

  <main class="profile-panel">
    <section class="date-block" aria-label="Ngày và giờ hiện tại">
      <h1 id="weekday">SUN DAY</h1>
      <p class="date-line" id="dateLine"></p>
      <p class="time-line" id="timeLine"></p>
    </section>

    <section class="calendar" aria-label="Lịch tháng">
      <div class="calendar-top"><button id="prevMonth" aria-label="Tháng trước">‹</button><h2 id="monthName">OCTOBER</h2><button id="nextMonth" aria-label="Tháng sau">›</button></div>
      <div class="calendar-rule"></div>
      <div class="calendar-grid calendar-weekdays" aria-hidden="true"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
      <div class="calendar-grid" id="calendarDays"></div>
    </section>

    <section class="profile-stats" aria-label="Thông tin nhanh">
      <div class="stat-item"><div class="stat-value"><span aria-hidden="true">★</span> 4.6</div><div class="stat-label">rating</div></div>
      <div class="stat-item"><div class="stat-value">7 days</div><div class="stat-label">duration</div></div>
      <div class="stat-item"><div class="stat-value">$44/hr</div><div class="stat-label">rate</div></div>
    </section>

    <img class="character-art" src="Sukuna.png" alt="Nhân vật Sukuna minh họa theo phong cách manga">
    <div class="view-count" aria-label="Số lượt xem"><svg viewBox="0 0 40 28" aria-hidden="true"><path d="M2 14S8 3 20 3s18 11 18 11-6 11-18 11S2 14 2 14Z"/><circle cx="20" cy="14" r="6"/></svg><span>1804</span></div>

    <section class="profile-side" aria-label="Giới thiệu và bộ sưu tập">
      <div class="nameplate"><span>SHYRED</span><img src="Avatar.jpg" alt="Ảnh đại diện manga của Shyred"></div>
      <h2 class="greeting">Hi, I'm Shyred :3</h2>
      <div class="gallery" id="gallery" aria-label="Bộ sưu tập">
        <button class="gallery-tile manga-tile" data-image="Manga_Eyes.jpg" aria-label="Mở ảnh manga"><img src="Manga_Eyes.jpg" alt="Bộ sưu tập tranh manga đen trắng"></button>
        <div class="tile-stack"><button class="gallery-tile" data-image="Lamborghini.jpg" aria-label="Mở ảnh xe"><img src="Lamborghini.jpg" alt="Lamborghini đỗ trên phố ban đêm"></button><button class="gallery-tile" data-image="music.jpg" aria-label="Mở ảnh âm nhạc"><img src="music.jpg" alt="Góc nghe nhạc và playlist cá nhân"></button></div>
      </div>
      <div class="music-player" aria-label="Trình phát nhạc">
        <img class="album-art" src="music-avatar.jpg" alt="Góc nghe nhạc và playlist cá nhân">
        <div class="player-content"><div class="track-title">TỰ SỰ</div><div class="track-artist">Changg, lotdaynee</div><div class="progress-row"><span class="current-time">0:00</span><input id="trackProgress" type="range" min="0" max="100" value="0" aria-label="Tiến trình bài hát"><span class="duration">0:00</span></div><div class="player-controls"><button id="rewindButton" aria-label="Lùi 10 giây">|◀</button><button class="play-button" id="playButton" aria-label="Phát nhạc">▶</button><button id="forwardButton" aria-label="Tiến 10 giây">▶|</button><button id="repeatButton" class="repeat-button" aria-label="Bật chế độ lặp lại" aria-pressed="false" title="Bật lặp lại">↻</button><label class="volume-control" aria-label="Âm lượng"><span aria-hidden="true">♪</span><input id="volumeControl" type="range" min="0" max="1" step="0.01" value="0.65" aria-label="Âm lượng"></label></div></div>
      </div>
      <audio id="profileAudio" preload="metadata" src="Tự%20Sự.mp3" hidden></audio>
    </section>
  </main>

  <aside class="settings-panel" id="settingsPanel" aria-label="Cài đặt profile" aria-hidden="true"><button class="settings-close" id="settingsClose" aria-label="Đóng">×</button><p class="settings-kicker">PERSONAL SPACE</p><h2>Góc của bạn</h2><p>Điều chỉnh giao diện và hình ảnh profile.</p>
    <button class="theme-toggle" id="themeToggle">Chuyển nền tối</button>
    <label for="themeColorStart">Màu chủ đề</label><div class="color-pair"><input type="color" id="themeColorStart" value="#d9d9d9" aria-label="Màu chủ đề thứ nhất"><input type="color" id="themeColorEnd" value="#777777" aria-label="Màu chủ đề thứ hai"></div>
    <label class="gradient-option"><input type="checkbox" id="gradientToggle" checked> Dùng chuyển màu gradient</label>
    <label for="avatarUpload">Đổi avatar</label><input class="file-control" type="file" id="avatarUpload" accept="image/*">
    <label for="backgroundUpload">Đổi ảnh, GIF hoặc video nền</label><input class="file-control" type="file" id="backgroundUpload" accept="image/*,video/*">
    <label for="galleryUpload1">Đổi ảnh trưng bày</label><div class="gallery-upload-list"><input class="file-control" type="file" id="galleryUpload1" accept="image/*" aria-label="Ảnh trưng bày 1"><input class="file-control" type="file" id="galleryUpload2" accept="image/*" aria-label="Ảnh trưng bày 2"><input class="file-control" type="file" id="galleryUpload3" accept="image/*" aria-label="Ảnh trưng bày 3"></div>
  </aside>
  <div class="search-panel" id="searchPanel" aria-hidden="true"><label for="gallerySearch">Tìm trong bộ sưu tập</label><input id="gallerySearch" type="search" placeholder="Manga, xe, âm nhạc…"><button id="searchClose" aria-label="Đóng tìm kiếm">×</button></div>
  <div class="image-viewer" id="imageViewer" aria-hidden="true"><button id="viewerClose" aria-label="Đóng ảnh">×</button><img src="" alt="Ảnh phóng to"></div>
</body>
</html>
